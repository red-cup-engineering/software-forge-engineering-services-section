name: Forge source and SignCraft runtime contracts
on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/forge-source-contract.yml"
permissions:
  contents: read
concurrency:
  group: forge-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Run original pure contract tests
        run: |
          npm run check
          npm test
          npm pack --dry-run --ignore-scripts

  published-signcraft-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Resolve SignCraft 0.5.6 only from existing publicly readable registry
        run: |
          set -euo pipefail
          npm view @red-cup-engineering/signcraft@0.5.6 version --registry=https://registry.561.group/
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
          node -e "const p=require('./node_modules/@red-cup-engineering/signcraft/package.json'); if(p.name!=='@red-cup-engineering/signcraft'||p.version!=='0.5.6') process.exit(1)"
          # These Git blob OIDs were fetched from the exact SignCraft Git commit
          # named by the original source-bound integration fixture. No private
          # checkout, credential or source copy occurs on this public runner.
          test "$(git hash-object node_modules/@red-cup-engineering/signcraft/src/inference/generate.mjs)" = "24ee356f70183024f9cf15d192162442a06ac287"
          test "$(git hash-object node_modules/@red-cup-engineering/signcraft/src/inference/kernel.mjs)" = "0730feced483602516c0abe11bd77564c2810787"
          test "$(git hash-object node_modules/@red-cup-engineering/signcraft/src/inference/nuclei.mjs)" = "db39518eaeeac37fcb2b9e241486656872d0e986"
          node --test test/signcraft-native-integration.test.mjs
